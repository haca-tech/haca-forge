services:
  # 1. API Web Service (Unified backend: Express API + Socket.IO + node-cron scheduler)
  - type: web
    name: mmp-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build -w packages/shared
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      # Email (docs/EMAIL.md): EMAIL_DRIVER=smtp with a Gmail app password. Values are set in the Render dashboard.
      - key: EMAIL_DRIVER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_LOGO_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PHONE_OTP_CHANNEL
        sync: false
      # File storage on Bunny (docs/STORAGE.md). Values are set in the Render dashboard.
      - key: STORAGE_DRIVER
        value: bunny
      - key: BUNNY_STORAGE_ZONE
        sync: false
      - key: BUNNY_STORAGE_HOST
        sync: false
      - key: BUNNY_STORAGE_KEY
        sync: false
      - key: BUNNY_CDN_URL
        sync: false
      - key: BUNNY_TOKEN_KEY
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
